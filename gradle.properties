group=net.sunnysmp
id=geyser
version=2.12.1-SNAPSHOT
description=Allows for players from Minecraft: Bedrock Edition to join Minecraft: Java Edition servers.

# Daemon & JVM
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m -XX:+UseCompactObjectHeaders
org.gradle.vfs.watch=false

# Build performance
org.gradle.cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.configureondemand=true

# Configuration cache & isolated projects
org.gradle.configuration-cache=false
org.gradle.configuration-cache.parallel=true
org.gradle.isolated-projects=false

# Kotlin
kotlin.stdlib.default.dependency=false

ConditorisSentryOrg=conditoris
ConditorisSentryProject=minecraft-backends
